<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartAttend — Automated Real-Time Face Recognition Attendance System for Colleges & Educational Institutions">
    <title>{% block title %}SmartAttend — AI Face Recognition Attendance{% endblock %}</title>

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (Public Line Icons API) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Base Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block additional_css %}{% endblock %}
</head>
<body>
    <!-- Flash Messages (Green Palette, Zero Emojis) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div style="position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;max-width:400px;">
                {% for category, message in messages %}
                    <div class="alert">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>{{ message }}</span>
                        <button class="alert-dismiss" onclick="this.parentElement.remove()">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    {% block additional_js %}{% endblock %}
</body>
</html>
